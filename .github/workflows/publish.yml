name: Publish Sileo Repository

on:
  push:
    branches: [main]
    paths:
      - 'pool/**'
      - 'index.html'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate APT repository metadata
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(pool/*.deb)
          if (( ${#debs[@]} == 0 )); then
            echo "No .deb package found in pool/."
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gzip bzip2 xz-utils

          mkdir -p _site/pool
          cp -v pool/*.deb _site/pool/
          cp index.html _site/index.html
          touch _site/.nojekyll

          # Build the flat APT package index at the repository root.
          dpkg-scanpackages --multiversion pool /dev/null > _site/Packages
          gzip -n -9 -c _site/Packages > _site/Packages.gz
          bzip2 -9 -c _site/Packages > _site/Packages.bz2
          xz -9 -c _site/Packages > _site/Packages.xz

          # Sileo looks for Release metadata at the source root.
          cd _site
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="4nn0yys" \
            -o APT::FTPArchive::Release::Label="4nn0yys Mochy Music" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Version="1" \
            -o APT::FTPArchive::Release::Codename="ios" \
            -o APT::FTPArchive::Release::Architectures="iphoneos-arm iphoneos-arm64" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="4nn0yys Mochy Music Sileo Repository" \
            release . > Release

          test -s Release
          test -s Packages
          grep -q '^Package:' Packages
          grep -q '^Filename: pool/' Packages
          echo "APT files generated:"
          ls -lh Release Packages Packages.gz Packages.bz2 Packages.xz
          echo "Package metadata:"
          grep -E '^(Package|Version|Architecture|Filename):' Packages || true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
